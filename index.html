<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forever Rail Operations Center</title>
<meta name="description" content="Something new is coming down the line for Forever Rail Community members. Opening here soon.">
<meta name="theme-color" content="#0F1115">
<meta property="og:type" content="website">
<meta property="og:url" content="https://oc.foreverrail.com/">
<meta property="og:title" content="Forever Rail Operations Center">
<meta property="og:description" content="The last piece is on its way. Opening here soon.">
<meta property="og:image" content="https://oc.foreverrail.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Jost:wght@500;600&display=swap">
<style>
  :root {
    --ground: #0F1115;
    --text: #EDEEF0;
    --muted: #B4BAC4;
    --faint: #9AA1AD;
    --line: #3A3F49;
    --orange: #FC8300; /* Forever Rail Dark Orange */
  }
  html { background: var(--ground); }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    background: var(--ground);
    color: var(--text);
    font-family: Barlow, system-ui, sans-serif;
  }

  /* The puzzle: rails from the map, cut into pieces, with the center piece out of its gap (laid out by the script). */
  .board { position: fixed; inset: 0; width: 100%; height: 100%; }
  .board .seam { stroke: #FFFFFF; stroke-opacity: 0.12; stroke-width: 1.4; }
  .board .gap { fill: var(--ground); stroke: var(--orange); stroke-opacity: 0.8; stroke-width: 2; stroke-dasharray: 8 7; }
  .board .loose {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 1400ms cubic-bezier(.2, .8, .2, 1) 400ms;
    filter: drop-shadow(0 24px 30px rgba(0, 0, 0, 0.6));
  }
  .board.settled .loose { transform: var(--rest); }

  /* The logo and the site's name, clear of the gap. */
  .brand {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 28px clamp(20px, 3vw, 40px);
  }
  .brand img { display: block; height: 44px; width: auto; }
  .brand span { padding-left: 16px; border-left: 1px solid var(--line); font-family: Jost, sans-serif; font-weight: 500; font-size: 17px; color: var(--faint); }

  /* The message sits in the gap. The wide layout's gap is 480 of the drawing's 1440 x 900, scaled to cover the
     window, so max(33.3vw, 53.3vh) wide: the message stays a little narrower. */
  .message {
    position: relative;
    width: min(440px, max(30vw, 48vh), calc(100% - 48px));
    margin: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
  }
  h1 { margin: 0; font-family: Jost, sans-serif; font-weight: 600; font-size: 36px; line-height: 1.08; letter-spacing: -0.01em; text-wrap: balance; }
  .lede { margin: 0; font-size: 16px; line-height: 1.5; color: var(--muted); text-wrap: pretty; }
  nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  nav a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 16px;
    border-radius: 10px;
    border: 1px solid var(--line);
    color: var(--text);
    font-weight: 500;
    font-size: 15px;
    text-decoration: none;
  }
  nav a:hover { border-color: var(--faint); }
  nav a.primary { padding: 0 18px; border-color: var(--text); background: var(--text); color: var(--ground); font-weight: 600; }
  nav a.primary:hover { background: #FFFFFF; }
  nav a:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }

  /* Phones and short screens: one column of full-width pieces. */
  @media (max-width: 760px), (max-height: 600px) {
    .brand { padding: 16px 20px; }
    .brand img { height: 36px; }
    .brand span { font-size: 15px; padding-left: 12px; }
    .message { width: min(400px, calc(100% - 56px)); }
    h1 { font-size: 30px; }
  }
  /* Upright phones: the logo centered above the gap's top tab. Sideways, it stays top left, beside the tab. */
  @media (max-width: 760px) {
    .brand { right: 0; justify-content: center; padding: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .board .loose { transition: none; }
  }
</style>
</head>
<body>
  <svg class="board" aria-hidden="true">
    <defs>
      <pattern id="rails" patternUnits="userSpaceOnUse" x="0" y="0">
        <image preserveAspectRatio="xMidYMid slice"></image>
      </pattern>
    </defs>
    <g class="pieces"></g>
    <rect class="dim" fill="#0F1115" fill-opacity="0.3"></rect>
    <path class="gap"></path>
    <g class="loose"><path class="seam" fill="url(#rails)" stroke-opacity="0.25"></path></g>
  </svg>

  <header class="brand">
    <img src="/logo.png" width="129" height="44" alt="Forever Rail">
    <span>Operations Center</span>
  </header>

  <main class="message">
    <h1>The last piece is on its way.</h1>
    <p class="lede">Something new is coming down the line for Forever Rail Community members. Opening here soon.</p>
    <nav aria-label="Forever Rail links">
      <a class="primary" href="https://discord.gg/jFVVCJVbuh">Join the Discord</a>
      <a href="https://status.foreverrail.com">Server status</a>
    </nav>
  </main>

  <script>
    // Cuts the rails drawing into a jigsaw whose center piece is out of its gap, with the message in the gap.
    // Wide screens: a fixed 3 x 3 board over a 1440 x 900 drawing, scaled to cover the window.
    // Phones and short screens: one column of full-width pieces, the gap as tall as the message needs.
    (() => {
      const NS = 'http://www.w3.org/2000/svg';
      const board = document.querySelector('.board');
      const message = document.querySelector('.message');
      const narrow = matchMedia('(max-width: 760px), (max-height: 600px)');

      // One side of a piece from P to Q: a tab out (d = 1), a blank in (d = -1) or straight (d = 0).
      function side(P, Q, out, d, size) {
        if (!d) return `L${Q[0]} ${Q[1]}`;
        const at = (t, n) => `${(P[0] + (Q[0] - P[0]) * t + out[0] * n * size * d).toFixed(1)} ${(P[1] + (Q[1] - P[1]) * t + out[1] * n * size * d).toFixed(1)}`;
        return `L${at(0.36, 0)}C${at(0.40, 0)} ${at(0.42, 0.04)} ${at(0.40, 0.10)}C${at(0.37, 0.20)} ${at(0.44, 0.27)} ${at(0.50, 0.27)}`
          + `C${at(0.56, 0.27)} ${at(0.63, 0.20)} ${at(0.60, 0.10)}C${at(0.58, 0.04)} ${at(0.60, 0)} ${at(0.64, 0)}L${Q[0]} ${Q[1]}`;
      }
      // A piece at x, y of w x h, its sides [top, right, bottom, left]; `tab` sets how big the tabs are.
      function piece(x, y, w, h, [top, right, bottom, left], tab) {
        return `M${x.toFixed(1)} ${y.toFixed(1)}` + side([x, y], [x + w, y], [0, -1], top, tab) + side([x + w, y], [x + w, y + h], [1, 0], right, tab)
          + side([x + w, y + h], [x, y + h], [0, 1], bottom, tab) + side([x, y + h], [x, y], [-1, 0], left, tab) + 'Z';
      }

      // The 3 x 3 board. Shared edges: 1 bulges toward the higher row or column; around the center all bulge outward.
      function wide() {
        const W = 480, H = 300;
        const rows = (r, c) => (c === 1 ? (r === 0 ? -1 : 1) : (r + c) % 2 ? 1 : -1);
        const cols = (r, c) => (r === 1 ? (c === 0 ? -1 : 1) : (r + c) % 2 ? -1 : 1);
        const sides = (r, c) => [r === 0 ? 0 : -rows(r - 1, c), c === 2 ? 0 : cols(r, c), r === 2 ? 0 : rows(r, c), c === 0 ? 0 : -cols(r, c - 1)];
        const pieces = [];
        for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
          if (r !== 1 || c !== 1) pieces.push(piece(c * W, r * H, W, H, sides(r, c), H));
        }
        return { width: 1440, height: 900, fit: 'slice', image: '/track.webp', pieces,
                 gap: piece(W, H, W, H, sides(1, 1), H), rest: 'translate(560px, 360px) rotate(-9deg)' };
      }

      // One column as wide as the screen. Pieces only lock top and bottom; around the gap both bulge outward.
      function column() {
        const width = innerWidth, height = innerHeight;
        const H = Math.round(message.offsetHeight + 72), top = Math.round((height - H) / 2), tab = Math.min(width, H) * 0.7;
        const edge = (k) => (k === -1 ? -1 : k === 0 ? 1 : Math.abs(k) % 2 ? 1 : -1); // between row k and k + 1
        const pieces = [];
        for (let k = -Math.ceil(top / H) - 1; top + k * H < height + H; k++) {
          if (k !== 0) pieces.push(piece(0, top + k * H, width, H, [-edge(k - 1), 0, edge(k), 0], tab));
        }
        return { width, height, fit: 'none', image: '/track-tall.webp', pieces,
                 gap: piece(0, top, width, H, [1, 0, 1, 0], tab), rest: `translate(${Math.round(width * 0.3)}px, ${Math.round(height / 2 + H * 0.15)}px) rotate(-8deg)` };
      }

      function lay() {
        const p = narrow.matches ? column() : wide();
        board.setAttribute('viewBox', `0 0 ${p.width} ${p.height}`);
        board.setAttribute('preserveAspectRatio', p.fit === 'slice' ? 'xMidYMid slice' : 'none');
        const pattern = board.querySelector('#rails'), image = pattern.querySelector('image');
        for (const el of [pattern, image]) { el.setAttribute('width', p.width); el.setAttribute('height', p.height); }
        image.setAttribute('href', p.image);
        const dim = board.querySelector('.dim');
        dim.setAttribute('width', p.width); dim.setAttribute('height', p.height);
        board.querySelector('.pieces').replaceChildren(...p.pieces.map((d) => {
          const path = document.createElementNS(NS, 'path');
          path.setAttribute('class', 'seam');
          path.setAttribute('fill', 'url(#rails)');
          path.setAttribute('d', d);
          return path;
        }));
        board.querySelector('.gap').setAttribute('d', p.gap);
        board.querySelector('.loose path').setAttribute('d', p.gap);
        board.style.setProperty('--rest', p.rest);
      }

      lay();
      requestAnimationFrame(() => requestAnimationFrame(() => board.classList.add('settled')));
      // The column's gap follows the message's height, which changes when the fonts arrive or the screen turns.
      let pending;
      addEventListener('resize', () => { clearTimeout(pending); pending = setTimeout(lay, 120); });
      narrow.addEventListener('change', lay);
      document.fonts?.ready.then(lay);
    })();
  </script>
</body>
</html>
